name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-slide
    steps:
      - uses: actions/checkout@v7
        with:
          path: command-slide

      # The `mcts` path dependency in Cargo.toml resolves to `../monte_carlo`,
      # so the sibling repository has to sit next to this checkout. Pinned to a
      # commit: an unpinned default branch would let a change over there break a
      # deploy here with no commit in this repository to explain it. Bump this
      # deliberately, alongside whatever change here needs the newer engine.
      - uses: actions/checkout@v7
        with:
          repository: skylerberg/monte_carlo
          ref: 9935aa1d3800e33afa1c5659ca4e5552f4059f9f
          path: monte_carlo

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: command-slide/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: command-slide

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: command-slide/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
