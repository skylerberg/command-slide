[workspace]
members = ["command-slide-core", "command-slide-wasm", "command-slide-runner"]
resolver = "2"

[workspace.dependencies]
# Pinned to a commit rather than a branch: an unpinned engine would let a
# change over there move the AI here with no commit in this repository to
# explain it. Bump deliberately, alongside whatever needs the newer engine.
mcts = { git = "https://github.com/skylerberg/monte_carlo", rev = "c82cd621841abde8f8895b29376fd73311b87d84", default-features = false }
mcts-tune = { git = "https://github.com/skylerberg/monte_carlo", rev = "c82cd621841abde8f8895b29376fd73311b87d84" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wyrand = "0.4"

[profile.release]
lto = true
codegen-units = 1
