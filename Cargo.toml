[workspace]
members = ["command-slide-core", "command-slide-wasm", "command-slide-runner"]
resolver = "2"

[workspace.dependencies]
# Pinned to a commit rather than a branch: an unpinned engine would let a
# change over there move the AI here with no commit in this repository to
# explain it. Bump deliberately, alongside whatever needs the newer engine.
mcts = { git = "https://github.com/skylerberg/monte_carlo", rev = "624f924d47387e1f55e4f16bb5ac4e4dd9abdc09", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wyrand = "0.4"

[profile.release]
lto = true
codegen-units = 1
