[workspace]
members = ["command-slide-core", "command-slide-wasm", "command-slide-runner"]
resolver = "2"

[workspace.dependencies]
mcts = { path = "../monte_carlo", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wyrand = "0.4"

[profile.release]
lto = true
codegen-units = 1
